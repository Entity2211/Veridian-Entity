<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Verification | Veridian Entity</title><style>body{background:#090D16;color:#F1F5F9;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:20px;padding:35px;border:1px solid #234;border-radius:16px;text-align:center}button{padding:12px 18px;border:0;border-radius:8px;background:#0B835C;color:#fff;font-weight:bold}</style></head><body><div class="box"><h1 id="title">Verifying payment…</h1><p id="msg">Please wait while Veridian Entity confirms your transaction.</p><button onclick="location.href='/'">Return to Veridian Entity</button></div><script>async function run(){const ref=localStorage.getItem("ve_pending_reference");if(!ref){title.textContent="No payment reference";msg.textContent="Return to the website and start checkout again.";return}const token=localStorage.getItem("ve_token");if(!token){title.textContent="Please log in";msg.textContent="Your payment was completed, but the browser session is missing. Log in again to verify your order.";return}try{const r=await fetch("/api/payments/verify/"+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Verification failed");if(d.paid){title.textContent="Payment confirmed ✓";msg.textContent=`Your ${d.user.plan} access is now active until ${new Date(d.user.planExpiresAt).toLocaleString()}.`;localStorage.removeItem("ve_pending_reference")}else{title.textContent="Payment not confirmed yet";msg.textContent="The payment provider has not reported a successful transaction. Please wait a moment and try again.";}}catch(e){title.textContent="Verification issue";msg.textContent=e.message}}run()</script></body></html>
